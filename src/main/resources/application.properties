spring.application.name=Online Hackthon Management System
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class=com.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.security.user.name=admin
spring.security.user.password=secret123
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=900000
security.jwt.refresh-token.expiration-time=604800000
logging.level.org.springframework.security=DEBUG
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.verification-sid=${TWILIO_VERIFICATION_SSID}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.config.import=optional:file:.env[.properties]
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}